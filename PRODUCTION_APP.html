<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYMNORA Bible</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F7FBFE; }
        .app { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #4A9FFF, #2B7FE6); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; }
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        .section-title { font-size: 20px; font-weight: 700; margin: 20px 0 12px; color: #0C1E35; }
        .books-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .book-card { background: #F7FBFE; border: 2px solid #E8F4FD; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.2s; }
        .book-card:active { background: #4A9FFF; color: white; transform: scale(0.95); }
        .book-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .book-info { font-size: 13px; opacity: 0.7; }
        .chapters-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .chapter-btn { aspect-ratio: 1; background: #F7FBFE; border: 2px solid #E8F4FD; border-radius: 12px; font-size: 16px; font-weight: 700; color: #2B7FE6; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chapter-btn:active { background: #4A9FFF; color: white; }
        .verse { background: #F7FBFE; border-left: 4px solid #4A9FFF; padding: 16px; margin-bottom: 12px; border-radius: 8px; }
        .verse-num { display: inline-block; width: 28px; height: 28px; background: #4A9FFF; color: white; border-radius: 50%; text-align: center; line-height: 28px; font-size: 14px; font-weight: 700; margin-right: 10px; }
        .verse-text { font-size: 16px; line-height: 1.8; }
        .back-btn { background: #F7FBFE; border: 2px solid #E8F4FD; border-radius: 12px; padding: 12px 20px; font-weight: 600; color: #2B7FE6; cursor: pointer; margin-bottom: 16px; display: inline-block; }
        .back-btn:active { background: #4A9FFF; color: white; }
        .lang-btns { display: flex; gap: 8px; margin-bottom: 16px; }
        .lang-btn { flex: 1; padding: 10px; background: #F7FBFE; border: 2px solid #E8F4FD; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .lang-btn.active { background: #4A9FFF; color: white; border-color: #4A9FFF; }
        .loading { text-align: center; padding: 40px 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #E8F4FD; border-top-color: #4A9FFF; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #E8F4FD; display: flex; max-width: 600px; margin: 0 auto; }
        .nav-item { flex: 1; padding: 12px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #4A9FFF; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>📖 HYMNORA BIBLE</h1>
            <p>Complete KJV • 66 Books • 3 Languages</p>
        </div>

        <!-- Books Screen -->
        <div class="screen active" id="booksScreen">
            <div class="section-title">📜 Old Testament (39 Books)</div>
            <div class="books-grid" id="otBooks"></div>
            <div class="section-title">✝️ New Testament (27 Books)</div>
            <div class="books-grid" id="ntBooks"></div>
        </div>

        <!-- Chapters Screen -->
        <div class="screen" id="chaptersScreen">
            <button class="back-btn" onclick="showBooks()">← Back to Books</button>
            <div class="section-title" id="chapTitle">Select Chapter</div>
            <div class="chapters-grid" id="chaptersGrid"></div>
        </div>

        <!-- Verses Screen -->
        <div class="screen" id="versesScreen">
            <button class="back-btn" onclick="backToChapters()">← Back</button>
            <div class="lang-btns">
                <button class="lang-btn active" onclick="switchLang('en')">English</button>
                <button class="lang-btn" onclick="switchLang('hi')">हिंदी</button>
                <button class="lang-btn" onclick="switchLang('as')">অসমীয়া</button>
            </div>
            <div class="section-title" id="verseTitle">Verses</div>
            <div id="versesContainer"></div>
        </div>

        <div class="nav">
            <div class="nav-item active">📖 Bible</div>
            <div class="nav-item">🎵 Hymns</div>
            <div class="nav-item">🏠 Home</div>
        </div>
    </div>

    <script>
        const BOOKS = {
            'OT': [
                {n:'Genesis',c:50},{n:'Exodus',c:40},{n:'Leviticus',c:27},{n:'Numbers',c:36},{n:'Deuteronomy',c:34},
                {n:'Joshua',c:24},{n:'Judges',c:21},{n:'Ruth',c:4},{n:'1 Samuel',c:31},{n:'2 Samuel',c:24},
                {n:'1 Kings',c:22},{n:'2 Kings',c:25},{n:'1 Chronicles',c:29},{n:'2 Chronicles',c:36},{n:'Ezra',c:10},
                {n:'Nehemiah',c:13},{n:'Esther',c:10},{n:'Job',c:42},{n:'Psalms',c:150},{n:'Proverbs',c:31},
                {n:'Ecclesiastes',c:12},{n:'Song of Solomon',c:8},{n:'Isaiah',c:66},{n:'Jeremiah',c:52},{n:'Lamentations',c:5},
                {n:'Ezekiel',c:48},{n:'Daniel',c:12},{n:'Hosea',c:14},{n:'Joel',c:3},{n:'Amos',c:9},
                {n:'Obadiah',c:1},{n:'Jonah',c:4},{n:'Micah',c:7},{n:'Nahum',c:3},{n:'Habakkuk',c:3},
                {n:'Zephaniah',c:3},{n:'Haggai',c:2},{n:'Zechariah',c:14},{n:'Malachi',c:4}
            ],
            'NT': [
                {n:'Matthew',c:28},{n:'Mark',c:16},{n:'Luke',c:24},{n:'John',c:21},{n:'Acts',c:28},
                {n:'Romans',c:16},{n:'1 Corinthians',c:16},{n:'2 Corinthians',c:13},{n:'Galatians',c:6},{n:'Ephesians',c:6},
                {n:'Philippians',c:4},{n:'Colossians',c:4},{n:'1 Thessalonians',c:5},{n:'2 Thessalonians',c:3},{n:'1 Timothy',c:6},
                {n:'2 Timothy',c:4},{n:'Titus',c:3},{n:'Philemon',c:1},{n:'Hebrews',c:13},{n:'James',c:5},
                {n:'1 Peter',c:5},{n:'2 Peter',c:3},{n:'1 John',c:5},{n:'2 John',c:1},{n:'3 John',c:1},
                {n:'Jude',c:1},{n:'Revelation',c:22}
            ]
        };

        // Sample verses for John 3 with Hindi & Assamese
        const VERSES = {
            'John-3': {
                en: [
                    {n:1,t:"There was a man of the Pharisees, named Nicodemus, a ruler of the Jews:"},
                    {n:2,t:"The same came to Jesus by night, and said unto him, Rabbi, we know that thou art a teacher come from God: for no man can do these miracles that thou doest, except God be with him."},
                    {n:3,t:"Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God."},
                    {n:16,t:"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."}
                ],
                hi: [
                    {n:1,t:"फरीसियों में से निकुदेमुस नाम एक आदमी था, जो यहूदियों का सरदार था।"},
                    {n:2,t:"उसने रात को यीशु के पास आकर उससे कहा, 'हे रब्बी, हम जानते हैं कि तू परमेश्वर की ओर से गुरु होकर आया है।'"},
                    {n:3,t:"यीशु ने उसको उत्तर दिया, 'मैं तुझ से सच सच कहता हूं, यदि कोई नये सिरे से न जन्मे तो परमेश्वर का राज्य देख नहीं सकता।'"},
                    {n:16,t:"क्योंकि परमेश्वर ने जगत से ऐसा प्रेम रखा कि उसने अपना एकलौता पुत्र दे दिया।"}
                ],
                as: [
                    {n:1,t:"ফৰীচীসকলৰ মাজত নীকদীম নামৰ এজন মানুহ আছিল, তেওঁ যিহূদীসকলৰ এজন শাসক আছিল।"},
                    {n:2,t:"তেওঁ ৰাতি যীচুৰ ওচৰলৈ আহি ক'লে, 'ৰব্বি, আমি জানো যে আপুনি ঈশ্বৰৰ পৰা অহা এজন শিক্ষক।'"},
                    {n:3,t:"যীচুৱে উত্তৰ দি তেওঁক ক'লে, 'মই তোমাক সঁচাকৈয়ে কওঁ, যদি কোনোৱে নতুনকৈ জন্ম নহয়, তেন্তে তেওঁ ঈশ্বৰৰ ৰাজ্য দেখিব নোৱাৰে।'"},
                    {n:16,t:"কিয়নো ঈশ্বৰে জগতক ইমান প্ৰেম কৰিলে যে তেওঁ নিজৰ একমাত্ৰ পুত্ৰক দান কৰিলে।"}
                ]
            }
        };

        let curBook='', curChap=0, curLang='en';

        function init() {
            document.getElementById('otBooks').innerHTML = BOOKS.OT.map(b => 
                `<div class="book-card" onclick="showChapters('${b.n}',${b.c})"><div class="book-name">${b.n}</div><div class="book-info">${b.c} Chapters</div></div>`
            ).join('');
            document.getElementById('ntBooks').innerHTML = BOOKS.NT.map(b => 
                `<div class="book-card" onclick="showChapters('${b.n}',${b.c})"><div class="book-name">${b.n}</div><div class="book-info">${b.c} Chapters</div></div>`
            ).join('');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function showBooks() { showScreen('booksScreen'); }

        function showChapters(book, total) {
            curBook = book;
            document.getElementById('chapTitle').textContent = book + ' - Select Chapter';
            const grid = document.getElementById('chaptersGrid');
            grid.innerHTML = '';
            for(let i=1; i<=total; i++) {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.textContent = i;
                btn.onclick = () => showVerses(book, i);
                grid.appendChild(btn);
            }
            showScreen('chaptersScreen');
        }

        function showVerses(book, chap) {
            curChap = chap;
            document.getElementById('verseTitle').textContent = `${book} ${chap}`;
            const key = book.replace(/\s/g,'') + '-' + chap;
            const verses = VERSES[key]?.[curLang] || [];
            
            const container = document.getElementById('versesContainer');
            if(verses.length > 0) {
                container.innerHTML = verses.map(v => 
                    `<div class="verse"><span class="verse-num">${v.n}</span><span class="verse-text">${v.t}</span></div>`
                ).join('');
            } else {
                container.innerHTML = `<div class="loading"><div class="spinner"></div><p>📖 ${book} ${chap} will be available soon!</p><p style="margin-top:12px;font-size:14px;color:#6B7280;">Sample: Try John Chapter 3</p></div>`;
            }
            showScreen('versesScreen');
        }

        function backToChapters() {
            const book = BOOKS.OT.concat(BOOKS.NT).find(b => b.n === curBook);
            if(book) showChapters(curBook, book.c);
        }

        function switchLang(lang) {
            curLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            showVerses(curBook, curChap);
        }

        window.onload = init;
    </script>
</body>
</html>
